name = "recallos-key-server"
main = "workers/get-key.js"
compatibility_date = "2024-12-18"

# KV 命名空间：先执行下面命令创建，再回填 id / preview_id
#   wrangler kv:namespace create "RECALLOS_KV"
#   wrangler kv:namespace create "RECALLOS_KV" --preview
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"
